[package]
name = "wckd-control-center"
version = "0.9.6"
description = "WCKD Control Center"
authors = ["WCKD"]
edition = "2021"

[lib]
name = "wckd_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
